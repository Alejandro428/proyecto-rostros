services:
  # --- INFRAESTRUCTURA ---
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -c "
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
          echo 'Esperando a Kafka...' && sleep 2;
        done &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic images.raw --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cmd.face_detection --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic evt.face_detection.completed --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cmd.age_detection --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic evt.age_detection.completed --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cmd.pixelation --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cmd.storage --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic evt.pixelation.completed --partitions 1 --replication-factor 1 &&
        echo '--- Todos los topics Kafka creados ---'
      "
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d
    networks:
      - backend

  # --- SERVICIOS ---

  api-1:
    build: ./services/api-1
    container_name: api-1
    ports:
      - "8000:8000"
    environment:
      - KAFKA_SERVER=${KAFKA_SERVER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      db:
        condition: service_started
    networks:
      - backend

  detection-service:
    build: ./services/detection-service
    container_name: detection-service
    environment:
      - KAFKA_SERVER=${KAFKA_SERVER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - insightface_models:/root/.insightface/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      db:
        condition: service_started
    networks:
      - backend

  age-detection:
    build: ./services/age-service
    container_name: age-detection
    environment:
      - KAFKA_SERVER=${KAFKA_SERVER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      db:
        condition: service_started
    networks:
      - backend

  orchestrator-2:
    build: ./services/orchestrator-2
    container_name: orchestrator-2
    environment:
      - KAFKA_SERVER=${KAFKA_SERVER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      db:
        condition: service_started
    networks:
      - backend

  orchestrator-3:
    build: ./services/orchestrator-3
    container_name: orchestrator-3
    environment:
      - KAFKA_SERVER=${KAFKA_SERVER}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_started
    networks:
      - backend

  pixelation:
    build: ./services/pixelation-service
    container_name: pixelation
    environment:
      - KAFKA_SERVER=${KAFKA_SERVER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      db:
        condition: service_started
    networks:
      - backend

  api-2:
    build: ./services/api-2
    container_name: api-2
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      - db
      - minio
    networks:
      - backend

  frontend-builder:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/app/dist
    command: sh -c "npm install --no-audit --no-fund && npm run build"

  frontend:
    image: nginx:stable
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./services/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      api-1:
        condition: service_started
      api-2:
        condition: service_started
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  frontend_node_modules:
  frontend_dist:
  insightface_models:
